<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Торшер — витрина</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="screen" id="screen">
    <header class="topbar">
      <div class="brand">
        <img class="brand__logo" id="logo" alt="">
        <div>
          <div class="brand__name" id="cafeName"></div>
          <div class="brand__tagline" id="cafeTagline"></div>
        </div>
      </div>
      <div class="clock">
        <div class="clock__time" id="clockTime">--:--</div>
        <div class="clock__date" id="clockDate"></div>
      </div>
    </header>

    <main class="stage" id="stage"></main>

    <div class="progress"><div class="progress__bar" id="progress"></div></div>

    <footer class="ticker" id="ticker">
      <div class="ticker__track" id="tickerTrack"></div>
    </footer>

    <div class="status" id="status" hidden></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
