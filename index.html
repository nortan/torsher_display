<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <script>
    /* Страховочная перезагрузка: стандартный <meta http-equiv="refresh"> через settings.autoRefreshMinutes
       (берётся из последних данных в localStorage, по умолчанию 30 мин, 0 — выключено).
       Срабатывает, даже если дальше что-то сломалось. В предпросмотре админки не ставится. */
    (function () {
      if (/[?&]preview=1/.test(location.search)) return;
      var m = 30;
      try {
        var d = JSON.parse(localStorage.getItem('torsher-display-data'));
        var v = d && d.settings && d.settings.autoRefreshMinutes;
        if (v !== undefined && v !== null && v !== '' && !isNaN(v)) m = +v;
      } catch (e) { /* нет хранилища */ }
      if (m > 0) document.write('<meta http-equiv="refresh" id="autoRefresh" content="' + Math.round(m * 60) + '">');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Торшер — витрина</title>
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="vendor/swiper/swiper-flat.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-light">
  <!-- Холст 1080×1920 (вертикальный FullHD). app.js масштабирует его под фактический вьюпорт. -->
  <div class="canvas" id="canvas">
    <header class="topbar" id="topbar">
      <div class="brand" id="brand">
        <img class="brand__logo" id="logo" alt="">
        <div>
          <div class="brand__name" id="cafeName"></div>
          <div class="brand__tagline" id="cafeTagline"></div>
        </div>
      </div>
      <div class="clock" id="clock">
        <div class="clock__time" id="clockTime">--:--</div>
        <div class="clock__date" id="clockDate"></div>
      </div>
    </header>

    <main class="swiper stage" id="stage">
      <div class="swiper-wrapper" id="slides"></div>
    </main>

    <div class="progress" id="progressWrap"><div class="progress__bar" id="progress"></div></div>

    <footer class="ticker" id="ticker">
      <div class="ticker__track" id="tickerTrack"></div>
    </footer>

    <div class="status" id="status" hidden></div>
  </div>

  <script src="vendor/gsap/gsap.min.js"></script>
  <script src="vendor/gsap/SplitText.min.js"></script>
  <script src="vendor/gsap/CustomEase.min.js"></script>
  <script src="vendor/gsap/ScrambleTextPlugin.min.js"></script>
  <script src="vendor/swiper/swiper-bundle.min.js"></script>
  <script src="shared/model.js"></script>
  <!-- content/data.js создаётся при сборке: резерв для запуска без сервера (file://) -->
  <script src="content/data.js" onerror="this.remove()"></script>
  <script src="app.js"></script>
</body>
</html>
