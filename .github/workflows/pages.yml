name: Витрина → GitHub Pages

# Публикует плеер и админку на GitHub Pages при каждом изменении main
# (в том числе при коммите из админки кнопкой «Опубликовать в Git»).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверка данных
        run: node -e "JSON.parse(require('fs').readFileSync('content/data.json','utf8'))"
      - name: Сборка
        run: node tools/build.mjs --with-admin
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
